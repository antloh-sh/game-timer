<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Turn Timer · Canvas</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #070a12;
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #app {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
<canvas id="app"></canvas>
<script>
(function() {
  'use strict';

  const canvas = document.getElementById('app');
  if (!canvas) { alert('Canvas not found'); return; }
  const ctx = canvas.getContext('2d');
  if (!ctx) { alert('2D context not supported'); return; }

  // ---------- Dimensions ----------
  let dpr = 1;
  let cssW = 0, cssH = 0;

  function resize() {
    // Cap DPR to limit canvas memory use on high-density mobile screens.
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const viewport = window.visualViewport;
    cssW = (viewport && viewport.width) || document.documentElement.clientWidth || window.innerWidth || 400;
    cssH = (viewport && viewport.height) || document.documentElement.clientHeight || window.innerHeight || 720;
    canvas.width = Math.max(1, Math.floor(cssW * dpr));
    canvas.height = Math.max(1, Math.floor(cssH * dpr));
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    draw();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }

  // ---------- Virtual layout ----------
  const DW = 400, DH = 720;
  let scale = 1, offsetX = 0, offsetY = 0;

  function layout() {
    const padX = 12, padY = 12;
    const availW = cssW - padX * 2;
    const availH = cssH - padY * 2;
    scale = Math.min(availW / DW, availH / DH);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    offsetX = (cssW - DW * scale) / 2;
    offsetY = (cssH - DH * scale) / 2;
  }

  function toDesign(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left - offsetX) / scale,
      y: (clientY - r.top - offsetY) / scale
    };
  }

  // ---------- State ----------
  let phase = 'setup';
  let totalSeconds = 30;
  let startSeconds = 30;
  let timerInterval = null;
  let deadlineMs = null;
  let pausedRemainingMs = null;
  let lastBeepSecond = null;

  let minutesVal = 0;
  let secondsVal = 30;

  let activeField = null;
  const hiddenInput = document.createElement('input');
  hiddenInput.type = 'tel';
  hiddenInput.inputMode = 'numeric';
  hiddenInput.pattern = '[0-9]*';
  hiddenInput.style.cssText = 'position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;top:-100px;left:-100px;';
  document.body.appendChild(hiddenInput);

  hiddenInput.addEventListener('input', () => {
    let v = hiddenInput.value.replace(/\D/g, '');
    if (v === '') v = '0';
    let n = parseInt(v, 10);
    if (activeField === 'min') {
      n = Math.min(99, Math.max(0, n));
      minutesVal = n;
    } else if (activeField === 'sec') {
      n = Math.min(59, Math.max(0, n));
      secondsVal = n;
    }
    hiddenInput.value = String(n);
    updateTotalFromInputs();
    draw();
  });
  hiddenInput.addEventListener('blur', () => { activeField = null; draw(); });

  // ---------- Audio ----------
  let audioCtx = null;
  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }

  function playTone(freqStart, freqEnd, dur, vol, type, delay) {
    if (!audioCtx) initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    try {
      const now = audioCtx.currentTime + (delay || 0);
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freqStart, now);
      if (freqEnd && freqEnd !== freqStart) {
        osc.frequency.linearRampToValueAtTime(freqEnd, now + dur);
      }
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + dur);
    } catch (e) {}
  }

  // Short beep — plays for the last 5 seconds (5,4,3,2,1)
  function shortBeep() { playTone(988, 988, 0.1, 0.5, 'sine', 0); }

  // Bing — higher pitch (E7 + A7)
  function playBing(delay) {
    if (!audioCtx) initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    try {
      const now = audioCtx.currentTime + (delay || 0);
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc1.type = 'sine';
      osc2.type = 'sine';
      osc1.frequency.setValueAtTime(2637, now);     // E7
      osc2.frequency.setValueAtTime(3520, now);     // A7
      g.gain.setValueAtTime(0.5, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      osc1.connect(g);
      osc2.connect(g);
      g.connect(audioCtx.destination);
      osc1.start(now); osc1.stop(now + 0.35);
      osc2.start(now); osc2.stop(now + 0.35);
    } catch (e) {}
  }

  function bingSound() { playBing(0); }

  // Horn — now 0.5 second
  function longHorn() {
    if (!audioCtx) initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    try {
      const now = audioCtx.currentTime;
      const dur = 0.5;   // ← changed to 0.5s
      const master = audioCtx.createGain();
      master.gain.setValueAtTime(0.55, now);
      master.gain.setValueAtTime(0.55, now + dur - 0.12);   // small sustain
      master.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      master.connect(audioCtx.destination);

      const harmonics = [
        { freq: 220, vol: 1.0, type: 'sawtooth' },
        { freq: 330, vol: 0.6, type: 'sawtooth' },
        { freq: 440, vol: 0.5, type: 'square'   },
        { freq: 660, vol: 0.3, type: 'sawtooth' }
      ];

      harmonics.forEach(h => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = h.type;
        osc.frequency.setValueAtTime(h.freq, now);
        g.gain.setValueAtTime(h.vol, now);
        osc.connect(g);
        g.connect(master);
        osc.start(now);
        osc.stop(now + dur);
      });
    } catch (e) {}
  }

  // ---------- Timer logic ----------
  // Timing uses Date.now() deadlines; interval frequency is only for refreshing the display.
  function updateTotalFromInputs() {
    totalSeconds = minutesVal * 60 + secondsVal;
    if (totalSeconds < 1) totalSeconds = 1;
  }

  function goToSetup() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    deadlineMs = null;
    pausedRemainingMs = null;
    lastBeepSecond = null;
    phase = 'setup';
    totalSeconds = minutesVal * 60 + secondsVal;
    if (totalSeconds < 1) totalSeconds = 1;
    draw();
  }

  function goToRunning() {
    if (timerInterval) clearInterval(timerInterval);
    phase = 'running';
    startSeconds = totalSeconds;
    deadlineMs = Date.now() + totalSeconds * 1000;
    lastBeepSecond = null;
    bingSound();
    timerInterval = setInterval(onTick, 200);
    draw();
  }

  function goToEnded() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    deadlineMs = null;
    pausedRemainingMs = null;
    lastBeepSecond = null;
    phase = 'ended';
    totalSeconds = 0;
    longHorn();
    draw();
  }

  function restartCountdown() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    pausedRemainingMs = null;
    totalSeconds = startSeconds;
    phase = 'running';
    deadlineMs = Date.now() + totalSeconds * 1000;
    lastBeepSecond = null;
    bingSound();
    timerInterval = setInterval(onTick, 200);
    draw();
  }

  function pauseCountdown() {
    if (phase !== 'running' || deadlineMs === null) return;
    pausedRemainingMs = Math.max(0, deadlineMs - Date.now());
    totalSeconds = Math.max(0, Math.ceil(pausedRemainingMs / 1000));
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    deadlineMs = null;
    phase = 'paused';
    draw();
  }

  function resumeCountdown() {
    if (phase !== 'paused') return;
    const remaining = pausedRemainingMs === null ? totalSeconds * 1000 : pausedRemainingMs;
    deadlineMs = Date.now() + remaining;
    pausedRemainingMs = null;
    phase = 'running';
    timerInterval = setInterval(onTick, 200);
    draw();
  }

  // Derive remaining time from a deadline instead of counting interval callbacks.
  // Mobile browsers throttle timers in background tabs, so callback-counting drifts.
  function onTick() {
    if (phase !== 'running' || deadlineMs === null) return;

    const remaining = Math.max(0, Math.ceil((deadlineMs - Date.now()) / 1000));

    // Play at most one beep for each displayed second in the final six seconds.
    if (remaining > 0 && remaining <= 5 && remaining !== lastBeepSecond) {
      shortBeep();
      lastBeepSecond = remaining;
    }

    if (remaining !== totalSeconds) {
      totalSeconds = remaining;
      if (totalSeconds <= 0) {
        totalSeconds = 0;
        goToEnded();
      } else {
        draw();
      }
    } else if (remaining <= 0) {
      goToEnded();
    } else if (remaining <= 5) {
      // Keep repainting during the final seconds so the frame rim can flash.
      draw();
    }
  }

  // Recalculate immediately when a tab/app becomes visible again.
  // Browsers may suspend background audio; no webpage can guarantee a sound
  // while the phone is locked or the browser is suspended.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && phase === 'running') onTick();
  });
  window.addEventListener('pageshow', () => {
    resize();
    if (phase === 'running') onTick();
  });

  // ---------- Drawing ----------
  function roundRect(c, x, y, w, h, r) {
    if (w <= 0 || h <= 0) return;
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  const CARD    = { x: 20, y: 20, w: 360, h: 680, r: 48 };
  const STATUS  = { x: 130, y: 50, w: 140, h: 30, r: 15 };
  const TIMER   = { y: 110, h: 130 };
  const MIN_BOX = { x: 55, y: 270, w: 130, h: 100, r: 28 };
  const SEC_BOX = { x: 215, y: 270, w: 130, h: 100, r: 28 };
  const MIN_MINUS = { x: 65, y: 380, w: 48, h: 34, r: 12 };
  const MIN_PLUS  = { x: 127, y: 380, w: 48, h: 34, r: 12 };
  const SEC_MINUS = { x: 225, y: 380, w: 48, h: 34, r: 12 };
  const SEC_PLUS  = { x: 287, y: 380, w: 48, h: 34, r: 12 };
  const PRESET_30 = { x: 35, y: 425, w: 100, h: 40, r: 16 };
  const PRESET_60 = { x: 150, y: 425, w: 100, h: 40, r: 16 };
  const PRESET_120 = { x: 265, y: 425, w: 100, h: 40, r: 16 };
  const BTN_FULL = { x: 40, y: 485, w: 320, h: 82, r: 41 };
  const BTN_RESTART = { x: 30, y: 430, w: 160, h: 70, r: 30 };
  const BTN_PAUSE   = { x: 210, y: 430, w: 160, h: 70, r: 30 };
  const BTN_END     = { x: 40, y: 535, w: 320, h: 58, r: 29 };
  const HINT = { y: 625 };

  function draw() {
    try {
      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#070a12';
      ctx.fillRect(0, 0, cssW, cssH);
      ctx.restore();

      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      // Card
      ctx.shadowColor = 'rgba(0,0,0,0.7)';
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 20;
      ctx.fillStyle = 'rgba(18,24,40,0.95)';
      roundRect(ctx, CARD.x, CARD.y, CARD.w, CARD.h, CARD.r);
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      roundRect(ctx, CARD.x + 0.5, CARD.y + 0.5, CARD.w - 1, CARD.h - 1, CARD.r);
      ctx.stroke();

      // Flash the card rim yellow/red during the final five seconds.
      if (phase === 'running' && totalSeconds > 0 && totalSeconds <= 5) {
        const flashRed = Math.floor(Date.now() / 350) % 2 === 1;
        ctx.save();
        ctx.shadowColor = flashRed ? '#ff3b55' : '#ffd43b';
        ctx.shadowBlur = 24;
        ctx.strokeStyle = flashRed ? '#ff3b55' : '#ffd43b';
        ctx.lineWidth = 5;
        roundRect(ctx, CARD.x + 3, CARD.y + 3, CARD.w - 6, CARD.h - 6, CARD.r - 3);
        ctx.stroke();
        ctx.restore();
      }

      // Status pill
      let statusText = 'READY', statusFill = '#1c2538', statusBorder = '#2e3f60', statusTextColor = '#9bb2e6';
      if (phase === 'running') {
        statusText = 'RUNNING'; statusFill = '#1e3b2b'; statusBorder = '#2f7a4a'; statusTextColor = '#7bffb0';
      } else if (phase === 'paused') {
        statusText = 'PAUSED'; statusFill = '#3b321e'; statusBorder = '#aa8b3f'; statusTextColor = '#ffd86b';
      } else if (phase === 'ended') {
        statusText = 'ENDED'; statusFill = '#3b1e2a'; statusBorder = '#aa3f5a'; statusTextColor = '#ff8da1';
      }

      ctx.fillStyle = statusFill;
      roundRect(ctx, STATUS.x, STATUS.y, STATUS.w, STATUS.h, STATUS.r);
      ctx.fill();
      ctx.strokeStyle = statusBorder;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = statusTextColor;
      ctx.font = '600 13px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(statusText, STATUS.x + STATUS.w / 2, STATUS.y + STATUS.h / 2 + 1);

      // Timer digits
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      const timeStr = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

      let timeColor = '#f0f4ff';
      let timeShadow = 'rgba(90,140,255,0.4)';
      let timeGlowBlur = 20;

      if (phase === 'running' && totalSeconds <= 5 && totalSeconds > 0) {
        timeColor = totalSeconds <= 3 ? '#ff5e7c' : '#ffb347';
        timeShadow = totalSeconds <= 3 ? 'rgba(255,70,100,0.9)' : 'rgba(255,180,70,0.7)';
        timeGlowBlur = 30;
      } else if (phase === 'ended') {
        timeColor = '#ff5e7c';
        timeShadow = 'rgba(255,70,100,0.9)';
        timeGlowBlur = 30;
      }

      ctx.save();
      ctx.shadowColor = timeShadow;
      ctx.shadowBlur = timeGlowBlur;
      ctx.fillStyle = timeColor;
      ctx.font = '700 88px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(timeStr, CARD.x + CARD.w / 2, TIMER.y + TIMER.h / 2);
      ctx.restore();

      // Inputs
      if (phase === 'setup') {
        ctx.fillStyle = '#9aa8c7';
        ctx.font = '500 12px Inter, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('MIN', MIN_BOX.x + MIN_BOX.w / 2, MIN_BOX.y - 14);
        ctx.fillText('SEC', SEC_BOX.x + SEC_BOX.w / 2, SEC_BOX.y - 14);

        drawInputBox(MIN_BOX, String(minutesVal), activeField === 'min');
        drawInputBox(SEC_BOX, String(secondsVal).padStart(2, '0'), activeField === 'sec');

        // One-minute/second adjustment controls
        drawButton(MIN_MINUS, '−', '#26334b', '#1b2538', '#101827', 'rgba(0,0,0,0)', 24);
        drawButton(MIN_PLUS, '+', '#26334b', '#1b2538', '#101827', 'rgba(0,0,0,0)', 24);
        drawButton(SEC_MINUS, '−', '#26334b', '#1b2538', '#101827', 'rgba(0,0,0,0)', 24);
        drawButton(SEC_PLUS, '+', '#26334b', '#1b2538', '#101827', 'rgba(0,0,0,0)', 24);

        // Quick time presets
        drawButton(PRESET_30, '30 SEC', '#26334b', '#1b2538', '#101827', 'rgba(0,0,0,0)', 15);
        drawButton(PRESET_60, '1 MIN', '#26334b', '#1b2538', '#101827', 'rgba(0,0,0,0)', 15);
        drawButton(PRESET_120, '2 MIN', '#26334b', '#1b2538', '#101827', 'rgba(0,0,0,0)', 15);
      }

      // Buttons
      if (phase === 'setup') {
        drawButton(BTN_FULL, 'START', '#4f7cff', '#2e5bda', '#1a3170', 'rgba(46,91,218,0.4)', 30);
      } else {
        drawButton(BTN_RESTART, 'RESTART', '#2ec27e', '#1e8f5a', '#0e4a2e', 'rgba(30,143,90,0.4)', 19);
        if (phase === 'running' || phase === 'paused') {
          drawButton(BTN_PAUSE, phase === 'paused' ? 'RESUME' : 'PAUSE', '#f5c542', '#c99019', '#684b0b', 'rgba(245,197,66,0.25)', 18);
        }
        drawButton(BTN_END, 'END', '#ff5e7c', '#d43a58', '#7a1d31', 'rgba(212,58,88,0.4)', 22);
      }

      // Hint
      let hint = 'beep last 5s · 0.5s horn at end';
      if (phase === 'running') hint = 'PAUSE TIMER to hold countdown';
      else if (phase === 'paused') hint = 'RESUME to continue countdown';
      else if (phase === 'ended') hint = 'RESTART or END to set a new timer';

      ctx.fillStyle = '#6b7a9c';
      ctx.font = '500 12px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(hint, CARD.x + CARD.w / 2, HINT.y);

      ctx.restore();
    } catch (err) {
      try {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#070a12';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff5e7c';
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Error: ' + err.message, canvas.width / 2, canvas.height / 2);
      } catch (e) {}
      console.error(err);
    }
  }

  function drawInputBox(box, value, focused) {
    ctx.fillStyle = focused ? '#1f2a44' : '#1e2638';
    roundRect(ctx, box.x, box.y, box.w, box.h, box.r);
    ctx.fill();
    ctx.strokeStyle = focused ? '#4f7cff' : '#2e3a52';
    ctx.lineWidth = focused ? 2.5 : 1.5;
    roundRect(ctx, box.x, box.y, box.w, box.h, box.r);
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = '600 32px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(value, box.x + box.w / 2, box.y + box.h / 2 + 1);
  }

  function drawButton(box, label, fill1, fill2, shadowCol, glow, fontSize) {
    ctx.save();
    ctx.shadowColor = glow;
    ctx.shadowBlur = 20;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = shadowCol;
    roundRect(ctx, box.x, box.y + 6, box.w, box.h, box.r);
    ctx.fill();
    ctx.restore();

    const grad = ctx.createLinearGradient(box.x, box.y, box.x, box.y + box.h);
    grad.addColorStop(0, fill1);
    grad.addColorStop(1, fill2);
    ctx.fillStyle = grad;
    roundRect(ctx, box.x, box.y, box.w, box.h, box.r);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    roundRect(ctx, box.x + 0.5, box.y + 0.5, box.w - 1, box.h - 1, box.r);
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = '700 ' + fontSize + 'px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, box.x + box.w / 2, box.y + box.h / 2 + 1);
  }

  // ---------- Hit tests ----------
  function hit(px, py, box) {
    return px >= box.x && px <= box.x + box.w && py >= box.y && py <= box.y + box.h;
  }

  function handleClick(clientX, clientY) {
    const p = toDesign(clientX, clientY);

    if (phase === 'setup') {
      if (hit(p.x, p.y, BTN_FULL)) {
        initAudio();
        updateTotalFromInputs();
        if (totalSeconds < 1) { totalSeconds = 1; minutesVal = 0; secondsVal = 1; }
        goToRunning();
        return;
      }
      // Quick presets
      if (hit(p.x, p.y, PRESET_30) || hit(p.x, p.y, PRESET_60) || hit(p.x, p.y, PRESET_120)) {
        if (hit(p.x, p.y, PRESET_30)) { minutesVal = 0; secondsVal = 30; }
        else if (hit(p.x, p.y, PRESET_60)) { minutesVal = 1; secondsVal = 0; }
        else { minutesVal = 2; secondsVal = 0; }
        activeField = null;
        hiddenInput.blur();
        updateTotalFromInputs();
        draw();
        return;
      }

      // Adjust minutes or seconds by one per tap.
      if (hit(p.x, p.y, MIN_MINUS) || hit(p.x, p.y, MIN_PLUS) ||
          hit(p.x, p.y, SEC_MINUS) || hit(p.x, p.y, SEC_PLUS)) {
        if (hit(p.x, p.y, MIN_MINUS)) minutesVal = Math.max(0, minutesVal - 1);
        if (hit(p.x, p.y, MIN_PLUS)) minutesVal = Math.min(99, minutesVal + 1);
        if (hit(p.x, p.y, SEC_MINUS)) secondsVal = Math.max(0, secondsVal - 1);
        if (hit(p.x, p.y, SEC_PLUS)) secondsVal = Math.min(59, secondsVal + 1);
        activeField = null;
        hiddenInput.blur();
        updateTotalFromInputs();
        draw();
        return;
      }
      if (hit(p.x, p.y, MIN_BOX)) {
        initAudio();
        activeField = 'min';
        hiddenInput.value = String(minutesVal);
        hiddenInput.focus(); hiddenInput.select();
        draw();
        return;
      }
      if (hit(p.x, p.y, SEC_BOX)) {
        initAudio();
        activeField = 'sec';
        hiddenInput.value = String(secondsVal);
        hiddenInput.focus(); hiddenInput.select();
        draw();
        return;
      }
      if (activeField) {
        activeField = null;
        hiddenInput.blur();
        draw();
      }
      return;
    }

    if (hit(p.x, p.y, BTN_RESTART)) {
      initAudio();
      restartCountdown();
      return;
    }
    if ((phase === 'running' || phase === 'paused') && hit(p.x, p.y, BTN_PAUSE)) {
      if (phase === 'running') pauseCountdown();
      else resumeCountdown();
      return;
    }
    if (hit(p.x, p.y, BTN_END)) {
      initAudio();
      goToSetup();
      return;
    }
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleClick(e.clientX, e.clientY);
  });
  canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
  canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  window.addEventListener('keydown', (e) => {
    if (document.activeElement === hiddenInput) return;

    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      initAudio();
      if (phase === 'setup') {
        updateTotalFromInputs();
        if (totalSeconds < 1) { totalSeconds = 1; minutesVal = 0; secondsVal = 1; }
        goToRunning();
      } else if (phase === 'running') {
        pauseCountdown();
      } else if (phase === 'paused') {
        resumeCountdown();
      } else {
        goToSetup();
      }
    } else if ((e.key === 'r' || e.key === 'R') && (phase === 'running' || phase === 'ended')) {
      e.preventDefault();
      initAudio();
      restartCountdown();
    } else if (e.key === 'Escape' && phase !== 'setup') {
      e.preventDefault();
      initAudio();
      goToSetup();
    }
  });

  // ---------- Init ----------
  function boot() {
    updateTotalFromInputs();
    phase = 'setup';
    resize();
    if (cssW === 0 || cssH === 0) setTimeout(resize, 50);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
